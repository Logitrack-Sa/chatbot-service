spring.application.name=chatbot-service
server.port=${SERVER_PORT:8084}
spring.main.web-application-type=servlet
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.fail-fast=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.async.request-timeout=120s

logitrack.security.public-key-location=${JWT_PUBLIC_KEY_LOCATION:file:./certs/public.pem}
logitrack.security.issuer=${JWT_ISSUER:https://security-service}
logitrack.security.audience=chatbot-service
logitrack.security.key-id=${JWT_KEY_ID:logitrack-main}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8065/eureka/}
eureka.instance.appname=CHATBOT-SERVICE
eureka.instance.prefer-ip-address=true

spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none
spring.ai.openai.api-key=${AI_API_KEY:}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.completions-path=${AI_COMPLETIONS_PATH:/v1/chat/completions}
spring.ai.openai.chat.options.model=${AI_MODEL}
spring.ai.retry.max-attempts=2

spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=10000
spring.cloud.openfeign.client.config.default.loggerLevel=none
logitrack.clients.shipment-url=${SHIPMENT_SERVICE_URL:}
logitrack.clients.courier-url=${COURIER_SERVICE_URL:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
